name: CI

on:
  schedule:
    - cron: "5 4 * * SUN"
  push:
    branches:
      - "**"
    tags:
      - "v*"
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  # build the image 
  build:
    runs-on: ubuntu-latest
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v2

      # set up build using both layer and buildkit caching following this guide
      # https://evilmartians.com/chronicles/build-images-on-github-actions-with-docker-layer-caching
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@master

      - name: Cache Docker layers
        uses: actions/cache@v2
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-single-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-single-buildx

      - name: Login to Azure Container Registry
        uses: docker/login-action@v1
        with:
          registry: ${{ secrets.CONTAINER_REGISTRY }}
          username: ${{ secrets.CONTAINER_REGISTRY_USERNAME }}
          password: ${{ secrets.CONTAINER_REGISTRY_PASSWORD }}

      - name: Build and export
        uses: docker/build-push-action@v2
        with:
          context: .
          builder: ${{ steps.buildx.outputs.name }}
          file: ./Dockerfile
          tags: openclsim:latest
          outputs: type=docker,dest=/tmp/image.tar
          cache-from: type=gha, scope=${{ github.workflow }}
          cache-to: type=gha, scope=${{ github.workflow }}
          build-args: |
            "GITHUB_TOKEN=${{ secrets.GH_TOKEN }}"
            "CONTAINER_REGISTRY=${{ secrets.CONTAINER_REGISTRY }}"

      - name: Upload image to github artifacts
        uses: actions/upload-artifact@v2
        with:
          name: image
          path: /tmp/image.tar
          retention-days: 5

  # test the image in parallel
  test:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      # the test matrix is what controls the parallelism
      # https://docs.github.com/en/actions/learn-github-actions/workflow-syntax-for-github-actions#jobsjob_idstrategymatrix
      matrix:
        group: [1, 2]
      # run all parallel test runners to either failure or completion
      fail-fast: false
    steps:
      - uses: actions/checkout@v2

      - name: Login to Azure Container Registry
        uses: docker/login-action@v1
        with:
          registry: ${{ secrets.CONTAINER_REGISTRY }}
          username: ${{ secrets.CONTAINER_REGISTRY_USERNAME }}
          password: ${{ secrets.CONTAINER_REGISTRY_PASSWORD }}

      # an explicit pull step is not strictly necessary, but it pulls in parallel
      # and in the background while just `running docker-compose up` pulls images one by one
      - name: Run docker-compose pull
        run: docker-compose pull --ignore-pull-failures -q &
        continue-on-error: true

      - name: Download image from github artifacts
        uses: actions/download-artifact@v2
        with:
          name: image
          path: /tmp

      - name: Load image into docker
        run: |
          docker load --input /tmp/image.tar
          docker image ls -a

      - name: Run docker-compose up
        run: docker-compose -f docker-compose.yml -f docker-compose.test.yml up -d --remove-orphans

      - name: Install test dependecies
        run: docker-compose exec -T package bash -c "pip install -e .[testing]"

      - name: List installed packages
        run: docker-compose exec -T package bash -c "pip freeze"

      - name: Run tests
        run: >-
          docker-compose exec -T package bash -c '
            pytest \
              --cov=src \
              --cov=app \
              --durations=3 \
              --cov-config=setup.cfg \
              --cov-context=test \
              --black \
              --isort \
              -W default \
              tests src'

      - name: Extract coverage from container
        run: docker-compose exec -T package bash -c "cat .coverage" > .coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v2
        with:
          name: coverage${{ matrix.group }}
          path: .coverage
          retention-days: 1

  # Job for package deployment
  deployment:
    name: Deployment
    needs: test
    runs-on: ubuntu-latest
    steps:
    # Checkout the package
    - name: Checkout current branch from GitHub
      uses: actions/checkout@v3

    # Setup Python 3.10 for the deployment of the package
    - name: Setup python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    # Upgrade pip
    - run: python -m pip install --upgrade pip

    # Install build tools
    - run: pip install --upgrade build
    # Build the package
    - run: python -m build

    # Show the dist folder
    - run: ls ./dist
    # Save the whole dist folder as artifact
    - name: Upload artifacts
      uses: actions/upload-artifact@v3
      with:
        name: Deployment files
        path: ./dist
        retention-days: 1
    # Deploy the package
    - name: Update packages to support upload
      # only on tagged releases
      if: startsWith(github.ref, 'refs/tags/v')
      run: python -m pip install --upgrade twine keyring
    - name: Upload package to the AzureDevOps artifacts
      # only on tagged releases
      if: startsWith(github.ref, 'refs/tags/v')
      run: twine upload --repository-url ${{ secrets.ADO_PYPI_UPLOAD_URL }} -u '${{ secrets.ADO_PYPI_UPLOAD_ACC }}' -p ${{ secrets.ADO_PYPI_UPLOAD_PAT }} dist/* --verbose